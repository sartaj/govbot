# Visual Regression Testing for PRs
# Takes screenshots of the generated HTML feed and compares against baselines.
# Uploads visual diffs as artifacts for easy review.

name: Visual Regression Tests

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
    paths:
      - "tests/snapshots/**"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Update baseline snapshots"
        required: false
        type: boolean
        default: false

jobs:
  visual-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Check if snapshots exist
        id: check-snapshots
        run: |
          if [ -d "tests/snapshots" ] && [ "$(ls -A tests/snapshots 2>/dev/null)" ]; then
            echo "snapshots_exist=true" >> $GITHUB_OUTPUT
          else
            echo "snapshots_exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate baseline snapshots (first run)
        if: steps.check-snapshots.outputs.snapshots_exist == 'false'
        run: npm run test:visual:update

      - name: Run visual regression tests
        id: visual-tests
        if: steps.check-snapshots.outputs.snapshots_exist == 'true' && inputs.update_snapshots != true
        continue-on-error: true
        run: npm run test:visual

      - name: Update snapshots (manual trigger)
        if: inputs.update_snapshots == true
        run: npm run test:visual:update

      - name: Upload baseline snapshots (for first run)
        uses: actions/upload-artifact@v4
        if: steps.check-snapshots.outputs.snapshots_exist == 'false'
        with:
          name: baseline-snapshots
          path: tests/snapshots/
          retention-days: 90

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Upload snapshot diffs
        uses: actions/upload-artifact@v4
        if: failure() || steps.visual-tests.outcome == 'failure'
        with:
          name: snapshot-diffs
          path: |
            test-results/**/*-diff.png
            test-results/**/*-actual.png
            test-results/**/*-expected.png
          retention-days: 30

      - name: Comment on PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && steps.check-snapshots.outputs.snapshots_exist == 'false'
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Visual Regression Test - Baseline Created

            **No baseline snapshots found.** New baselines have been generated.

            ### Next steps:
            1. Download the \`baseline-snapshots\` artifact from [this workflow run](${runUrl})
            2. Add the snapshots to your branch at \`tests/snapshots/\`
            3. Commit and push the snapshots

            Or run locally:
            \`\`\`bash
            npm install
            npx playwright install --with-deps chromium webkit
            npm run test:visual:update
            git add tests/snapshots/
            git commit -m "Add visual regression baseline snapshots"
            \`\`\``
            });

      - name: Comment on PR with diff results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && steps.check-snapshots.outputs.snapshots_exist == 'true' && steps.visual-tests.outcome == 'failure'
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Visual Regression Test Results

            **Visual differences detected!** Please review the changes.

            ### How to review:
            1. Download the \`snapshot-diffs\` artifact from [this workflow run](${runUrl})
            2. Review the \`*-diff.png\` files to see what changed
            3. If the changes are intentional, update the snapshots by running:
               \`\`\`bash
               npm run test:visual:update
               \`\`\`
            4. Commit the updated snapshots

            ### Artifacts:
            - **visual-regression-report**: Full HTML report with interactive comparison
            - **snapshot-diffs**: Just the diff images for quick review`
            });

      - name: Fail if visual tests failed
        if: steps.visual-tests.outcome == 'failure'
        run: exit 1
